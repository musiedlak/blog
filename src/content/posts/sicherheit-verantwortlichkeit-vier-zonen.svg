<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="t d">
  <title id="t">Psychologische Sicherheit und Verantwortlichkeit als zwei Achsen</title>
  <desc id="d">Vier Zonen. Oben links die Komfortzone mit hoher psychologischer Sicherheit und niedriger Verantwortlichkeit, der Freundschaftsspiel-Modus. Oben rechts die Lernzone mit beidem hoch. Unten links die Apathiezone mit beidem niedrig. Unten rechts die Angstzone mit hoher Verantwortlichkeit und niedriger psychologischer Sicherheit.</desc>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#71717a"/>
    </marker>
  </defs>
  <g font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
    <!-- Zonen -->
    <rect x="62" y="10" width="240" height="180" rx="6" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="310" y="10" width="240" height="180" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="62" y="198" width="240" height="180" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1"/>
    <rect x="310" y="198" width="240" height="180" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1"/>

    <text x="182" y="98" font-size="24" font-weight="600" fill="#18181b">Komfortzone</text>
    <text x="182" y="126" font-size="13" font-weight="600" fill="#115e59">Freundschaftsspiel-Modus</text>

    <text x="430" y="98" font-size="24" font-weight="600" fill="#18181b">Lernzone</text>

    <text x="182" y="294" font-size="24" font-weight="600" fill="#18181b">Apathiezone</text>

    <text x="430" y="294" font-size="24" font-weight="600" fill="#18181b">Angstzone</text>

    <!-- Achsen -->
    <line x1="44" y1="378" x2="44" y2="10" stroke="#71717a" stroke-width="1.5" marker-end="url(#pfeil)"/>
    <line x1="62" y1="396" x2="550" y2="396" stroke="#71717a" stroke-width="1.5" marker-end="url(#pfeil)"/>

    <text transform="rotate(-90 18 194)" x="18" y="194" font-size="15" font-weight="500" fill="#18181b">Psychologische Sicherheit</text>
    <text transform="rotate(-90 18 378)" x="18" y="378" text-anchor="start" font-size="13" fill="#71717a">niedrig</text>
    <text transform="rotate(-90 18 10)" x="18" y="10" text-anchor="end" font-size="13" fill="#71717a">hoch</text>

    <text x="306" y="446" font-size="15" font-weight="500" fill="#18181b">Verantwortlichkeit</text>
    <text x="62" y="420" text-anchor="start" font-size="13" fill="#71717a">niedrig</text>
    <text x="550" y="420" text-anchor="end" font-size="13" fill="#71717a">hoch</text>
  </g>
</svg>
